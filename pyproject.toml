[project]
name = "legal-llm-evals"
version = "0.1.0"
description = "An evaluation harness that refuses to report a rate without a confidence interval, and refuses to trust a model judge it has not measured against a human"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
keywords = ["llm", "evaluation", "eval-harness", "inter-rater-agreement", "llm-as-judge", "statistics"]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
evals = "legal_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
