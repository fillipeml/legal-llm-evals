version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # pip, not uv: this package has no lockfile. It declares zero runtime dependencies and
  # pins only floors for the dev tools, so there is nothing for a lockfile to hold and
  # nothing for the pip ecosystem to leave out of step.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
